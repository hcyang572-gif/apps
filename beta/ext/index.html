<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>외부 브라우저 전환 시험</title>
<script>
(function(){
  var ua=navigator.userAgent||'', target='https://hcyang572-gif.github.io/apps/fishing/';
  window.__inapp=/KAKAOTALK/i.test(ua);
  if(!window.__inapp) return;
  // 1) 카톡 공식: 기본 외부 브라우저로
  location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(target);
  // 2) 안드로이드 예비책: 1.2초 뒤에도 여기 있으면 Chrome intent
  if(/Android/i.test(ua)) setTimeout(function(){ if(!document.hidden){ location.href='intent://'+target.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(target)+';end'; } },1200);
})();
</script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1b2a;color:#e8f1fb;font:17px/1.6 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;text-align:center;padding:0 20px}a{display:inline-block;margin-top:18px;padding:14px 22px;border-radius:12px;background:#2f80ed;color:#fff;text-decoration:none;font-weight:700}</style></head>
<body><main><p id="m">브라우저로 여는 중이에요…</p><a id="go" href="https://hcyang572-gif.github.io/apps/fishing/">직접 열기</a><p style="opacity:.6;font-size:14px" id="ua"></p></main>
<script>document.getElementById('ua').textContent=(window.__inapp?'카톡 안에서 열림':'일반 브라우저')+' · '+(/Android/i.test(navigator.userAgent)?'Android':'iOS/기타');
if(window.__inapp){document.getElementById('go').href='kakaotalk://web/openExternal?url='+encodeURIComponent('https://hcyang572-gif.github.io/apps/fishing/');document.getElementById('go').textContent='Chrome·사파리로 열기';}
else{location.replace('https://hcyang572-gif.github.io/apps/fishing/');}</script></body></html>
